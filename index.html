<script>
function play(url){
    const video = document.getElementById('player');

    if(Hls.isSupported()){
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    }else{
        video.src = url;
    }

    video.play();
}
</script>
